# ── 种子论文：建议补 5–10 篇你认可的基线 ─────────────────────────────
# 留空是刻意的：没有核实过的 arXiv ID 写进来只会制造"NOT FOUND"噪音。
# 填法：title + year + arxiv_id（核实过再加），然后 `papers.py seed-sync`。
seeds:
  frozen_recency: true
  items: []
