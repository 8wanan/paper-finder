# paper-finder 领域配置 · AI 方法论（为「AI 挖洞」服务的方法论）
#
# 这个 profile 的边界必须先说清楚，否则日报会退化：
#
#   ✗ 不是"通用 LLM 方法论" —— 那是每月 5000+ 篇的量级（实测 2026-09：
#     all:"LLM agent" 5631 篇/月），任何"普查/全量打分"都无意义，
#     简报必然变成 arXiv 全站 Top15，三天后你就不看了。
#   ✓ 是"能直接搬进挖洞系统的方法论" —— agent 架构、工具调用与沙箱、
#     上下文/记忆压缩、规划与长程任务、评测 harness 与基准、后训练与
#     test-time compute。每条查询都带"代码/软件/安全"锚点来控噪。
#
# 因此这个 profile 没有 Tier A 普查（census 为空），只有检索式的每日扫描：
# watch_scope: all 表示每日增量用 search + generation 查询。

name: ai-methodology
display_name: AI 方法论 · 顶会日报
version: 0.1
updated: 2026-10-30

sources:
  - arxiv
  - openalex

venue_policy: plus_preprint
venues:
  - ccs
  - sp
  - usenix
  - ndss
  - icse
  - fse
  - ase
  - issta
  - neurips
  - icml
  - iclr
  - acl
  - emnlp
  - naacl
  - aaai

watch_scope: all

interest: |
  关注**可以搬进"AI 挖洞"系统的方法论**：LLM/agent 的系统设计（规划、工具调用、
  沙箱执行、多 agent 协作）、上下文工程与记忆压缩、长程任务的稳定性与成本控制、
  评测 harness 与基准设计、后训练与强化学习、test-time compute 与推理。
  判断标准是"能不能用在我的漏洞发现/利用 agent 上"，而不是"是不是一个 LLM 技巧"。
  不关注：纯模型能力刷榜、与代码/软件/安全无关的通用 NLP 方法。

# Tier A 为空是刻意的：方法论不可穷举，硬做普查只会得到噪声。
census:
  depth: 200
  queries: []

# ── 每日检索集 ─────────────────────────────────────────────────────
# expect 为 2026-10-30 实测全量命中数，量大是预期的（检索式，不是普查）。
search:
  default_top: 20
  queries:
    - id: M1
      q: '(all:"LLM agent" OR all:"LLM-based agent" OR all:"agentic") AND (all:"vulnerability" OR all:"fuzzing" OR all:"exploit" OR all:"program analysis")'
      expect: 5819
    - id: M2
      q: '(all:"tool use" OR all:"function calling" OR all:"tool calling") AND all:"LLM" AND (all:"code" OR all:"software" OR all:"security")'
      expect: 1192
    - id: M3
      q: '(all:"long-horizon" OR all:"long horizon") AND (all:"agent" OR all:"LLM")'
      expect: 3348
    - id: M4
      q: '(all:"retrieval-augmented" OR all:"context engineering") AND all:"LLM" AND (all:"code" OR all:"software")'
      expect: 1341
    - id: M5
      q: '(all:"benchmark" OR all:"harness") AND (all:"LLM agent" OR all:"agentic") AND (all:"software engineering" OR all:"vulnerability" OR all:"code")'
      expect: 6816
    - id: M6
      q: '(all:"post-training" OR all:"reinforcement learning") AND all:"LLM" AND (all:"code" OR all:"vulnerability")'
      expect: 2463
    - id: M7
      q: '(all:"test-time compute" OR all:"reasoning") AND all:"LLM" AND (all:"vulnerability" OR all:"code")'
      expect: 7435
    # M8-M10：用户主线（RSI 自训练 / harness 创新）。2026-10-30 新增 ——
    # 原来的 M1-M7 太宽，捞回来的是"agent 泛观察"，不是可迁移的机制创新。
    - id: M8
      q: '(all:"self-training" OR all:"self-improvement" OR all:"self-evolving" OR all:"self-play" OR all:"recursive self-improvement") AND (all:"agent" OR all:"LLM")'
    - id: M9
      q: '(all:"harness" OR all:"scaffold" OR all:"context engineering") AND (all:"agent" OR all:"LLM") AND (all:"code" OR all:"software" OR all:"security")'
    - id: M10
      q: '(all:"verifier" OR all:"execution feedback" OR all:"test-time") AND all:"LLM" AND (all:"code" OR all:"vulnerability" OR all:"software")'
  generation_probes:
    - id: G1
      q: '(all:"agent scaffold" OR all:"agent harness" OR all:"agent framework") AND (all:"security" OR all:"vulnerability" OR all:"code")'
    - id: G2
      q: '(all:"context engineering" OR all:"memory compression" OR all:"compaction") AND all:"agent"'
    - id: G3
      q: '(all:"SWE-bench" OR all:"SWE-agent" OR all:"terminal-bench" OR all:"cybench")'

# ── 打分特征 ────────────────────────────────────────────────────────
# 与 ai-vuln-discovery 相反的方向：这里的第一条轴是**方法**，第二条轴是
# **代码/安全**。S_lex = S_method × (0.5 + 0.5 × S_domain)。
scoring:
  task_terms:      # 方法轴
    high:
      # 用户口径（2026-10-30）：要的是**可迁移到挖洞系统的 AI 应用创新** ——
      # 自训练/自我改进（RSI 那一类）、harness / scaffold、执行反馈与验证闭环、
      # 后训练与 test-time scaling。纯"多 agent 如何协同"的观察性研究不进必读。
      - self-improvement
      - self-training
      - self-play
      - self-evolving
      - recursive self-improvement
      - rsi
      - self-rewarding
      - harness
      - agent scaffold
      - agent framework
      - context engineering
      - memory compression
      - tool use
      - function calling
      - long-horizon
      - post-training
      - reinforcement learning
      - test-time compute
      - verifier
      - execution feedback
      - planning
      - llm agent
      - agentic
    mid:
      - multi-agent
      - retrieval-augmented
      - benchmark
      - agent
      - prompt
      - fine-tuning
      - distillation
      - chain-of-thought
      - reasoning
      - sandbox
      - execution feedback
      - evaluation
      - dataset
      - in-context learning
    low:
      - model
      - transformer
      - llm
      - language model
  ai_terms:        # 代码/安全锚点轴
    high:
      - vulnerability
      - fuzzing
      - exploit
      - program analysis
      - code
      - software
      - security
      - repair
      - patch
    mid:
      - static analysis
      - testing
      - debugging
      - repository
      - compiler
      - binary
      - repository-level
    low:
      - engineering
      - tool
      - development

  core_terms:
    # 进强推桶的必要条件：必须是"方法/机制"层面的信号。
    # benchmark / reasoning 这类泛词已移出 —— 它们会让评测类论文顶掉方法论文。
    - self-improvement
    - self-training
    - self-play
    - self-evolving
    - harness
    - scaffold
    - tool use
    - function calling
    - context engineering
    - verifier
    - execution feedback
    - post-training
    - test-time compute
    - planning

  # ── 标题门：强推必须在标题里就声明了"方法/机制" ──────────────────────
  # 用户口径：要的是 RSI 自训练、harness/scaffold 这类**可迁移的方法创新**，
  # 不是"多 agent 如何协同"的观察性研究，也不是 benchmark/评测。
  # 所以这里只放**机制词**，不放 code/security 这类领域词 —— 否则
  # "How Deterministic SAST and AI Security Agents Divide the Work" 这类
  # 评测对比论文会靠 security 一词混进来（实测）。
  title_required_any:
    - self-training
    - self-play
    - self-improvement
    - self-evolving
    - self-rewarding
    - rsi
    - harness
    - scaffold
    - context engineering
    - memory
    - post-training
    - reinforcement learning
    - verifier
    - tool use
    - planning
    - distillation
    - curriculum
    - test-time
    - agent framework

  # ── 扣分项：评测/观察类让位给方法创新 ───────────────────────────────
  # "多 agent 如何协同"这类观察性研究、以及 benchmark/survey 类，
  # 对搭系统帮助有限，降权处理（仍保留在归档里）。
  penalty_terms:
    high:
      - empirical study
      - empirical evaluation
      - "benchmark"
      - benchmarking
      - survey
      - how do
      - how well
      - evaluation of
      - understanding
      - analysis of
    mid:
      - multi-agent collaboration
      - agent collaboration
      - collaborative agents
      - comparison
      - dataset
      # 问句标题基本都是观察性研究（"How much does X matter?"/"Can agents do Y?"），
      # 对搭系统帮助有限；实测它们靠 harness/agent 这类词挤进了必读位。
      - how much
      - can agentic
      - can llm
      - do agents
      - does it

  category_weights:
    cs.SE: 0.35
    cs.CR: 0.30
    cs.LG: 0.25
    cs.AI: 0.25
    cs.CL: 0.20
    cs.PL: 0.10

  recency_tau_days: 365
  venue_whitelist:
    - "IEEE S&P"
    - "ACM CCS"
    - "USENIX Security"
    - NDSS
    - ICSE
    - FSE
    - ASE
    - ISSTA
    - NeurIPS
    - ICML
    - ICLR
    - ACL
    - EMNLP
    - NAACL
    - AAAI
  venue_scores:
    whitelist: 1.0
    preprint: 0.7
    other: 0.2

rubric:
  dimensions:
    - key: method_core
      label: 方法核心性
      desc: 是否提出可复用的方法论/架构，而不只是把 LLM 当工具用一次
      anchors:
        "0": 纯应用，没有任何方法层面的贡献
        "1": 组合已有方法，改进很局部
        "2": 有明确的方法设计（架构/流程/训练目标）
        "3": 提出可复用的框架级方法，别人能照着做
    - key: vuln_relevance
      label: 与挖洞的关系
      desc: 能不能直接搬到漏洞发现/利用/修复的流水线上
      anchors:
        "0": 与代码/安全无关
        "1": 只做通用代码任务（补全、单测生成），需大量改造
        "2": 面向软件工程任务，改造后可迁移
        "3": 直接面向漏洞/安全/程序分析
    - key: evidence
      label: 实证强度
      desc: 是否有可复现的基准与基线对比
      anchors:
        "0": 只给示例或个案
        "1": 单基准、无强基线
        "2": 多基准 + 基线对比
        "3": 多基准 + 消融 + 成本/稳定性分析
    - key: transferable
      label: 可迁移性
      desc: 换目标/换模型/换语言时是否还成立
      anchors:
        "0": 强绑定单一模型或单一数据集
        "1": 需要大量重调
        "2": 换目标需少量适配
        "3": 与模型/目标无关，可直接复用

negative:
  scope: title
  terms:
    - medical
    - legal
    - education
    - sentiment analysis
    - recommendation system
    - machine translation
    - image generation
    - speech recognition
    # 领域跑题（实测混进过：视频生成、广告 agent、机器人长程任务、研究品味评测）
    - video generation
    - advertising
    - robot
    - robotics
    - wafer
    - research agent
    - research taste
    - computer-use
  safety_overrides:
    - vulnerability
    - code
    - software
    - security
    - agent

# 展示口径：顶会论文近 2 年、预印本近 90 天（同 ai-vuln-discovery）
max_age_days: 90
conference_max_age_days: 730

thresholds:
  # 方法论这一轨噪声更大，每天最多推 10 篇，其中强推 8 篇即可
  strong_top: 8
  maybe_top: 10
  l1_strong: 0.65
  l1_maybe: 0.45
  l1_min_keep: 0.30
  l2_strong: 8
  l2_maybe: 5
  needs_review_l1_min: 0.50
  seed_score_floor: 0.65

# ── 会议采集：这一轨暂不配置 ─────────────────────────────────────────
# 原因（实测）：方法论的主战场是 NeurIPS/ICLR/ICML，它们的官方通道是 OpenReview，
# 而本机访问 api2.openreview.net 返回 403；用 OpenAlex 拿不到完整会议清单。
# 这些会议的论文绝大多数有 arXiv 版，所以每日 arXiv 扫描已经覆盖了主要部分。
# 想补会议：拿一个 OpenAlex source id 加进来即可（CCS/ICSE/FSE/ASE 都有）。
conferences: []

seeds:
  frozen_recency: true
  items: []
