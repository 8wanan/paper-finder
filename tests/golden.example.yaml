  #   arxiv_id: ""
  #   year:
  #   tier: A | B
  #   why: ""

# ── 负样本：明确不相关的（25 篇）────────────────────────────────
negatives:
  - title: "TODO 从你的 Zotero / 浏览记录里挑纯语音合成、音乐生成、语音增强的论文"
    why: "示例：模型再好也与安全无关"
